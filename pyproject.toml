[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-tracker"
version = "0.1.0"
description = "AI/Tech News Tracker — pulls developments from GitHub, Reddit, HN, arXiv"
requires-python = ">=3.11"
dependencies = [
    "tracker-core>=0.1.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.0",
    "python-dotenv>=1.0.0",
    "praw>=7.7.0",
    "aiosmtplib>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "playwright>=1.45.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["freellmapi_tracker*", "intel_sources*", "news_tracker*", "templates"]

[tool.setuptools.package-data]
templates = ["*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Tests share a helper module (verification_fixtures.py) rather than an installed package.
pythonpath = ["tests"]
